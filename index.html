<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐟 FISH PARTY 🐟</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,Arial,sans-serif;background:linear-gradient(#b5f3ff,#69cce9 60%,#248fc4);color:#06435c;overflow-x:hidden}.sea{position:fixed;inset:0;pointer-events:none;overflow:hidden}.fish{position:absolute;left:-20%;font-size:clamp(24px,5vw,58px);animation:swim linear infinite}@keyframes swim{to{transform:translateX(140vw) rotate(8deg)}}.bubble{position:absolute;bottom:-10%;border:2px solid #ffffff88;border-radius:50%;animation:rise linear infinite}@keyframes rise{to{transform:translateY(-120vh)}}main{position:relative;z-index:1;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}.panel{width:min(94vw,620px);background:#eaffffdf;border:3px solid white;border-radius:30px;box-shadow:0 15px 50px #076b9950;padding:30px 20px;text-align:center;backdrop-filter:blur(5px)}h1{font-size:clamp(40px,10vw,76px);line-height:1;margin:8px 0;color:#006eae;text-shadow:3px 4px #fff}h2{font-size:clamp(25px,6vw,42px);margin:12px 0;color:#006eae}.line{opacity:0;transform:translateY(20px) scale(.95);transition:opacity .5s,transform .5s;margin:12px 0}.line.show{opacity:1;transform:none}.bang{font-size:52px;font-weight:1000;color:#ff5487}.question{font-weight:1000;font-size:clamp(20px,5vw,30px)}.time{font-size:22px;font-weight:900}input{width:100%;padding:15px;font-size:20px;border:2px solid #54bde0;border-radius:14px;margin:12px 0;text-align:center}button{border:0;border-radius:16px;padding:14px 26px;background:#008fc2;color:white;font-size:22px;font-weight:900;cursor:pointer;margin:8px;box-shadow:0 5px #04618a}button:active{transform:translateY(3px);box-shadow:0 2px #04618a}.no{background:#ff628b;box-shadow:0 5px #b7355c}.hidden{display:none!important}.votes{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-top:20px}.voteBox{background:#fff9;border-radius:16px;padding:14px;overflow-wrap:anywhere}.voteBox h3{margin:0 0 10px}.voteBox p{margin:7px 0}.small{font-size:13px;opacity:.8}.status{font-weight:700}</style></head><body><div class="sea" id="sea"></div><main><section class="panel" id="entry"><div style="font-size:70px">🐠🪼🐟</div><h2>YOU'RE INVITED...</h2><p>First, tell the fish who you are.</p><form id="nameForm"><input id="name" maxlength="40" placeholder="Your name" autocomplete="name" required><button type="submit">DIVE IN 🐬</button></form></section><section class="panel hidden" id="invite"><h1 class="line">FISH PARTY</h1><div class="line bang">!!!!!!</div><p class="line question">LET’S ABUSE SUBSTANCES TODAY???!!!</p><p class="line time">START TIME: 11AM</p><p class="line time">END: NEVER</p><h2 class="line">DO YOU ACCEPT?</h2><div class="line"><button id="yes">◯ YES 🐟</button><button class="no" id="no">◯ NO 🦀</button></div></section><section class="panel hidden" id="results"><div style="font-size:58px">🐠🎉🐡</div><h2>THE FISH HAVE SPOKEN</h2><p class="status" id="status"></p><div class="votes"><div class="voteBox"><h3>✅ YES <span id="yesCount">0</span></h3><div id="yesList"></div></div><div class="voteBox"><h3>❌ NO <span id="noCount">0</span></h3><div id="noList"></div></div></div><p class="small" id="storageNote"></p><button id="refresh" style="font-size:15px">↻ REFRESH GUEST LIST</button></section></main><script>
const sea=document.getElementById('sea'),fish=['🐟','🐠','🐡','🦈','🐬','🪼','🐙','🦀'];for(let i=0;i<28;i++){let e=document.createElement('div');e.className='fish';e.textContent=fish[i%fish.length];e.style.top=Math.random()*90+'%';e.style.animationDuration=9+Math.random()*17+'s';e.style.animationDelay=-Math.random()*25+'s';sea.append(e)}for(let i=0;i<30;i++){let b=document.createElement('div');b.className='bubble';let size=5+Math.random()*24;b.style.width=b.style.height=size+'px';b.style.left=Math.random()*100+'%';b.style.animationDuration=5+Math.random()*12+'s';b.style.animationDelay=-Math.random()*15+'s';sea.append(b)}
const $=id=>document.getElementById(id);let guest='',vote='';$('nameForm').onsubmit=e=>{e.preventDefault();guest=$('name').value.trim();if(!guest)return;$('entry').classList.add('hidden');$('invite').classList.remove('hidden');document.querySelectorAll('#invite .line').forEach((el,i)=>setTimeout(()=>el.classList.add('show'),i*750+200))};
const API='/.netlify/functions/rsvp',key='fishPartyGuestId2026';let guestId=localStorage.getItem(key);if(!guestId){guestId=crypto.randomUUID();localStorage.setItem(key,guestId)}
async function getVotes(){const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('Guest list unavailable');return r.json()}
async function saveVote(){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:guestId,name:guest,vote})});if(!r.ok)throw Error('Could not save RSVP')}
async function showVotes(){try{const data=await getVotes();for(const choice of ['yes','no']){const entries=data.filter(x=>x.vote===choice);$(choice+'Count').textContent=entries.length;const target=$(choice+'List');target.replaceChildren();entries.forEach(x=>{const p=document.createElement('p');p.textContent='🐟 '+x.name;target.append(p)});if(!entries.length)target.textContent='No fish yet!'}$('storageNote').textContent='Shared guest list • refresh to see new votes'}catch(e){$('storageNote').textContent='Unable to load guest list: '+e.message}}
async function choose(v){vote=v;$('invite').classList.add('hidden');$('results').classList.remove('hidden');$('status').textContent='Saving your RSVP...';try{await saveVote();$('status').textContent=vote==='yes'?guest+', YOU’RE IN! 🐟💙':guest+', THE FISH WILL MISS YOU 🥲'}catch(e){$('status').textContent='Could not save your RSVP: '+e.message;return}await showVotes()}$('yes').onclick=()=>choose('yes');$('no').onclick=()=>choose('no');$('refresh').onclick=showVotes;
</script></body></html>
